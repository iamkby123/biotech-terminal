services:
  - type: web
    name: biotech-terminal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AACT_DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.10"
