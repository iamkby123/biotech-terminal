<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biotech Terminal - Recently Updated Trials</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{background:#0a0e1a;color:#e2e8f0;font-family:'Inter','Segoe UI',sans-serif;margin:0}
    .nav{background:#0d1117;border-bottom:1px solid #1e2a3a;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
    .nav a{color:#94a3b8;text-decoration:none;font-size:13px;margin-left:16px}
    .nav a:hover{color:#e2e8f0}
    .nav .brand{font-size:16px;font-weight:700;color:#e2e8f0}
    .nav .brand span{color:#8b5cf6}
    .section{background:#111827;border:1px solid #1f2937;border-radius:12px;margin-bottom:16px;overflow:hidden}
    .section-header{padding:16px 20px;border-bottom:1px solid #1e2a3a;background:#0d1623;display:flex;align-items:center;justify-content:space-between}
    .section-title{font-size:14px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em}
    .section-body{padding:20px}
    .trial-card{background:#0d1623;border:1px solid #1e2a3a;border-radius:10px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all 0.2s}
    .trial-card:hover{border-color:#3b82f6;background:#0f1729}
    .badge{display:inline-block;padding:2px 10px;border-radius:4px;font-size:11px;font-weight:600}
    .badge-phase1{background:#1e1b4b;color:#a78bfa}
    .badge-phase2{background:#172554;color:#60a5fa}
    .badge-phase3{background:#052e16;color:#4ade80}
    .badge-phase4{background:#422006;color:#fb923c}
    .badge-recruiting{background:#052e16;color:#4ade80;border:1px solid #14532d}
    .badge-completed{background:#0c1929;color:#60a5fa;border:1px solid #1e3a5f}
    .badge-terminated{background:#2d0a0a;color:#f87171;border:1px solid #7f1d1d}
    .badge-results{background:#1e1b4b;color:#a78bfa;border:1px solid #3730a3}
    .badge-new{background:#052e16;color:#4ade80;border:1px solid #14532d;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
    .sync-btn{background:#3b82f6;color:white;border:none;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
    .sync-btn:hover{background:#2563eb}
    .sync-btn:disabled{opacity:0.5;cursor:not-allowed}
    .loading{color:#64748b;font-size:13px;padding:40px;text-align:center}
    .empty{color:#64748b;font-size:14px;padding:60px;text-align:center}
  </style>
</head>
<body>
  <nav class="nav">
    <div style="display:flex;align-items:center;gap:16px">
      <a href="/" class="brand">🧬 <span>Biotech Terminal</span></a>
      <a href="/news">News</a>
      <a href="/recent" style="color:#a78bfa;font-weight:600">Recently Updated</a>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="sync-status" style="font-size:11px;color:#64748b"></span>
      <button class="sync-btn" id="sync-btn" onclick="syncTrials()">Sync Now</button>
    </div>
  </nav>

  <main style="max-width:1000px;margin:0 auto;padding:24px">
    <div style="margin-bottom:24px">
      <h1 style="font-size:22px;font-weight:700;margin:0">Recently Updated Clinical Trials</h1>
      <p style="font-size:13px;color:#64748b;margin-top:4px">Latest trials updated on ClinicalTrials.gov in the past 7 days. Auto-syncs daily.</p>
    </div>

    <div class="section">
      <div class="section-header">
        <span class="section-title" id="count-label">Loading...</span>
        <span style="font-size:11px;color:#64748b" id="last-update"></span>
      </div>
      <div class="section-body" id="trials-body">
        <div class="loading">Loading recently updated trials from ClinicalTrials.gov...</div>
      </div>
    </div>
  </main>

  <script>
    function $(id) { return document.getElementById(id); }

    function formatDate(d) {
      if (!d) return '';
      try { return new Date(d).toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'}); }
      catch { return d; }
    }

    function phaseClass(phase) {
      if (!phase) return '';
      if (phase.includes('4')) return 'badge-phase4';
      if (phase.includes('3')) return 'badge-phase3';
      if (phase.includes('2')) return 'badge-phase2';
      return 'badge-phase1';
    }

    function statusClass(status) {
      if (!status) return '';
      const s = status.toUpperCase();
      if (s.includes('RECRUIT')) return 'badge-recruiting';
      if (s.includes('COMPLET')) return 'badge-completed';
      if (s.includes('TERMINAT')) return 'badge-terminated';
      return '';
    }

    async function loadRecent() {
      try {
        const r = await fetch('/api/trials/recent?limit=50');
        const trials = await r.json();

        $('count-label').textContent = `${trials.length} Recently Updated Trials`;
        $('last-update').textContent = 'Updated: ' + new Date().toLocaleString();

        if (!trials.length) {
          $('trials-body').innerHTML = '<div class="empty">No recently updated trials found.</div>';
          return;
        }

        $('trials-body').innerHTML = trials.map(t => `
          <div class="trial-card" onclick="window.location.href='/trial/${t.nct_id}'">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px">
                  <span style="font-size:12px;font-weight:700;font-family:monospace;color:#60a5fa">${t.nct_id}</span>
                  ${t.phase ? `<span class="badge ${phaseClass(t.phase)}">${t.phase}</span>` : ''}
                  <span class="badge ${statusClass(t.status)}">${t.status || '?'}</span>
                  ${t.has_results ? '<span class="badge badge-results">Results Posted</span>' : ''}
                  ${t.last_update ? `<span style="font-size:10px;color:#64748b">Updated: ${formatDate(t.last_update)}</span>` : ''}
                </div>
                <div style="font-size:14px;font-weight:500;color:#e2e8f0;line-clamp:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.title || 'Untitled'}</div>
                <div style="display:flex;gap:16px;margin-top:6px;font-size:12px;color:#64748b">
                  ${t.sponsor ? `<span>Sponsor: ${t.sponsor.substring(0,30)}</span>` : ''}
                  ${t.condition ? `<span>Condition: ${t.condition.substring(0,35)}</span>` : ''}
                  ${t.enrollment ? `<span>N=${Number(t.enrollment).toLocaleString()}</span>` : ''}
                </div>
                ${t.intervention ? `<div style="font-size:11px;color:#a78bfa;margin-top:4px">Intervention: ${t.intervention.substring(0,60)}</div>` : ''}
              </div>
              <div style="text-align:right;flex-shrink:0">
                <span style="font-size:18px;color:#3b82f6">→</span>
              </div>
            </div>
          </div>
        `).join('');

      } catch(e) {
        $('trials-body').innerHTML = `<div class="empty" style="color:#f87171">Failed to load: ${e.message}</div>`;
      }
    }

    async function syncTrials() {
      const btn = $('sync-btn');
      const status = $('sync-status');
      btn.disabled = true;
      btn.textContent = 'Syncing...';
      status.textContent = 'Pulling from ClinicalTrials.gov...';

      try {
        const r = await fetch('/api/trials/sync', { method: 'POST' });
        const d = await r.json();
        status.textContent = `Synced ${d.fetched} trials (${d.synced} updated) in ${d.elapsed}s`;
        status.style.color = '#4ade80';
        // Reload the list
        await loadRecent();
      } catch(e) {
        status.textContent = `Sync failed: ${e.message}`;
        status.style.color = '#f87171';
      }

      btn.disabled = false;
      btn.textContent = 'Sync Now';
    }

    document.addEventListener('DOMContentLoaded', loadRecent);
  </script>
</body>
</html>
