<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biotech Terminal - Drug Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0e1a;color:#e2e8f0}
    a{color:#60a5fa;text-decoration:none}
    a:hover{text-decoration:underline}
    .header{position:sticky;top:0;z-index:100;background:#0d1117;border-bottom:1px solid #1e2a3a;padding:12px 20px;display:flex;align-items:center;gap:16px}
    .header-search{position:relative}
    .header-search input{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:8px 12px;color:#e2e8f0;font-size:14px;width:200px}
    .header-search input:focus{outline:none;border-color:#3b82f6}
    .main-content{max-width:1200px;margin:0 auto;padding:24px}
    .section{background:#111827;border:1px solid #1f2937;border-radius:12px;margin-bottom:24px;overflow:hidden}
    .section-header{padding:16px 20px;border-bottom:1px solid #1e2a3a;background:#0d1623;display:flex;align-items:center;justify-content:space-between}
    .section-title{font-size:14px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em}
    .section-body{padding:20px}
    .drug-header{background:linear-gradient(135deg,#1e3a5f 0%,#0d1623 100%);padding:32px;border-radius:12px;margin-bottom:24px;border:1px solid #1e2a3a}
    .drug-name{font-size:32px;font-weight:700;margin-bottom:12px;color:#e2e8f0}
    .drug-meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px}
    .meta-item{display:flex;flex-direction:column;gap:4px}
    .meta-label{font-size:12px;color:#64748b;text-transform:uppercase}
    .meta-value{font-size:16px;font-weight:600;color:#e2e8f0}
    .phase-badge{display:inline-block;padding:6px 16px;border-radius:6px;font-size:14px;font-weight:600}
    .phase-4{background:#1d4ed8;color:#fff}.phase-3{background:#3b82f6;color:#fff}.phase-2{background:#7c3aed;color:#fff}.phase-1{background:#a855f7;color:#fff}
    .trial-item{display:flex;flex-direction:column;gap:8px;padding:16px;background:#0d1623;border:1px solid #1e2a3a;border-radius:8px;margin-bottom:12px}
    .trial-title{font-size:15px;font-weight:600;color:#e2e8f0}
    .trial-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#64748b}
    .trial-tag{background:#1a2535;padding:4px 10px;border-radius:4px;font-size:12px}
    .condition-tag{background:#1e3a5f;padding:6px 12px;border-radius:6px;font-size:13px;display:inline-block;margin:4px}
    .sponsor-link{color:#60a5fa;cursor:pointer}.sponsor-link:hover{text-decoration:underline}
    .loading{display:flex;align-items:center;justify-content:center;height:200px;color:#64748b}
    .error{color:#ef4444;padding:20px;text-align:center}
    /* source badges */
    .source-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;cursor:default;position:relative;flex-shrink:0}
    .source-badge-data{background:#052e16;color:#4ade80;border:1px solid #16a34a}
    .source-badge-ai{background:#1e1b4b;color:#a78bfa;border:1px solid #6d28d9}
    .source-badge-evidence{background:#0c2d1a;color:#34d399;border:1px solid #059669}
    /* prediction */
    .pred-card{background:#0d1623;border:1px solid #1e3a5f;border-radius:10px;padding:16px;text-align:center}
    .pred-outcome{font-size:28px;font-weight:700;margin:4px 0}
    .pred-success{color:#4ade80}.pred-failure{color:#f87171}
    .pred-label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:0.05em}
    .evidence-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #1e2a3a;font-size:13px}
    .evidence-item:last-child{border-bottom:none}
    .evidence-score{min-width:40px;text-align:center;font-weight:600;color:#60a5fa}
    .ai-summary-container{border-left:3px solid #6d28d9!important}
    .ai-disclaimer{padding:8px 20px 12px;font-size:11px;color:#64748b;font-style:italic;border-top:1px solid #1e2a3a}
    .ai-loading-pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#a78bfa;animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
    /* chatbox */
    .chatbox{position:fixed;right:20px;bottom:20px;width:380px;max-height:520px;background:#111827;border:1px solid #1f2937;border-radius:12px;display:flex;flex-direction:column;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.5)}
    .chatbox.hidden{display:none}
    .chat-header{padding:12px 16px;background:#0d1623;border-bottom:1px solid #1e2a3a;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center}
    .chat-header span{font-size:13px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em}
    .chat-messages{flex:1;overflow-y:auto;padding:12px;max-height:360px}
    .chat-msg{margin-bottom:10px;font-size:13px;line-height:1.5}
    .chat-msg-user{color:#60a5fa}.chat-msg-ai{color:#c4b5fd}
    .chat-msg-meta{font-size:10px;color:#475569;margin-top:2px}
    .chat-input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #1e2a3a}
    .chat-input{flex:1;background:#0d1623;border:1px solid #1e2a3a;border-radius:6px;padding:8px 10px;color:#e2e8f0;font-size:13px}
    .chat-input:focus{outline:none;border-color:#3b82f6}
    .chat-send{background:#3b82f6;color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:13px;cursor:pointer}
    .chat-send:hover{background:#2563eb}
    .chat-toggle{position:fixed;right:20px;bottom:20px;width:48px;height:48px;border-radius:50%;background:#3b82f6;color:#fff;border:none;font-size:20px;cursor:pointer;z-index:199;box-shadow:0 4px 16px rgba(59,130,246,.4);display:flex;align-items:center;justify-content:center}
    .chat-toggle:hover{background:#2563eb}
    /* sidebar + breadcrumb */
    .breadcrumb{padding:6px 20px;background:#0d1117;border-bottom:1px solid #1e2a3a;font-size:12px;color:#64748b}
    .breadcrumb a{color:#60a5fa;font-weight:600;text-decoration:none}.breadcrumb a:hover{text-decoration:underline}
    .breadcrumb .sep{color:#475569;margin:0 6px}
    .page-wrap{display:flex;min-height:calc(100vh - 78px)}
    .sidebar{width:220px;min-width:220px;background:#0d1117;border-right:1px solid #1e2a3a;display:flex;flex-direction:column;position:sticky;top:42px;height:calc(100vh - 78px);overflow:hidden}
    .sb-ticker{padding:12px 16px;font-size:16px;font-weight:700;color:#e2e8f0;border-bottom:1px solid #1e2a3a}
    .sb-price{padding:6px 16px 10px;font-size:13px;border-bottom:1px solid #1e2a3a}
    .sb-section-hdr{padding:8px 16px 4px;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:0.05em}
    .sb-list{overflow-y:auto;flex:1}
    .sb-item{display:block;padding:5px 16px;font-size:12px;color:#94a3b8;text-decoration:none;border-left:3px solid transparent;transition:all .1s}
    .sb-item:hover{background:#111827;color:#e2e8f0;text-decoration:none;border-left-color:#3b82f6}
    .sb-item.active{color:#60a5fa;border-left-color:#60a5fa;background:#0d1623;font-weight:600}
    .main-scroll{flex:1;overflow-y:auto}
    .company-bar{padding:8px 20px;background:#0d1623;border-bottom:1px solid #1e2a3a;font-size:12px;display:flex;gap:16px;align-items:center}
    .company-bar a{color:#60a5fa;font-weight:600}
    @media(max-width:900px){.sidebar{display:none}}
    /* pipeline timeline */
    .pipeline-tl{display:flex;align-items:flex-start;gap:0;padding:16px 0;position:relative}
    .pipeline-tl::before{content:'';position:absolute;top:22px;left:0;right:0;height:3px;background:#1e2a3a;z-index:0}
    .pl-stage{flex:1;text-align:center;position:relative;z-index:1;min-width:0}
    .pl-dot{width:20px;height:20px;border-radius:50%;margin:12px auto 8px;border:2px solid #1e2a3a;background:#0a0e1a}
    .pl-dot.done{background:#10b981;border-color:#10b981}
    .pl-dot.active{background:#3b82f6;border-color:#3b82f6;box-shadow:0 0 8px rgba(59,130,246,.5)}
    .pl-dot.skipped{background:#0a0e1a;border:2px dashed #f59e0b}
    .pl-dot.none{background:#0a0e1a;border-color:#1e2a3a}
    .pl-label{font-size:11px;font-weight:600;color:#94a3b8}
    .pl-status{font-size:10px;color:#64748b;margin-top:2px}
    .pl-status.done{color:#10b981}.pl-status.active{color:#3b82f6}.pl-status.skipped{color:#f59e0b}.pl-status.future{color:#475569}
    .pl-date{font-size:9px;color:#475569;margin-top:2px}.pl-date.done{color:#6b8a6b}
    .pl-count{font-size:9px;color:#475569;margin-top:1px}
    .pl-connector{position:absolute;top:22px;left:0;height:3px;background:#10b981;z-index:0}
    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-track{background:#0d1117}
    ::-webkit-scrollbar-thumb{background:#1f2937;border-radius:4px}
  </style>
</head>
<body>
  <header class="header">
    <a href="/" style="font-size:18px;font-weight:700;color:#60a5fa">🧬 Biotech Terminal</a>
    <a href="javascript:history.back()" style="color:#94a3b8;font-size:14px">← Back</a>
    <div style="flex:1"></div>
    <div class="header-search">
      <input type="text" id="drug-search" placeholder="Search drug..." autocomplete="off" onkeypress="if(event.key==='Enter'){window.location.href='/drug/'+encodeURIComponent(this.value.trim())}">
    </div>
  </header>

  <!-- Breadcrumb -->
  <div class="breadcrumb" id="breadcrumb">
    <a href="/">Home</a><span class="sep">›</span><span id="bc-ticker">...</span><span class="sep">›</span><span>Drugs</span><span class="sep">›</span><span id="bc-drug" style="color:#e2e8f0">Loading...</span>
  </div>

  <div class="page-wrap">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sb-ticker" id="sb-ticker">--</div>
      <div class="sb-price" id="sb-price">--</div>
      <div class="sb-section-hdr">Drugs</div>
      <div class="sb-list" id="sb-drugs" style="max-height:40%">Loading...</div>
      <div class="sb-section-hdr">Trials</div>
      <div class="sb-list" id="sb-trials">Loading...</div>
    </div>
    <div class="main-scroll">
      <!-- Company bar -->
      <div class="company-bar" id="company-bar" style="display:none">
        <a id="cb-link" href="#">--</a>
        <span id="cb-name" style="color:#94a3b8">--</span>
        <span id="cb-price" style="color:#e2e8f0">--</span>
        <span id="cb-stats" style="color:#64748b">--</span>
      </div>

      <main class="main-content" id="main-content">
        <div class="loading">Loading drug data...</div>
      </main>
    </div>
  </div>

  <!-- Chatbox -->
  <button class="chat-toggle" id="chat-toggle" onclick="toggleChat()" title="AI Assistant">💬</button>
  <div class="chatbox hidden" id="chatbox">
    <div class="chat-header">
      <span>💬 AI Assistant</span>
      <button onclick="toggleChat()" style="background:none;border:none;color:#64748b;font-size:18px;cursor:pointer">&times;</button>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="chat-msg chat-msg-ai">Ask me about this drug, its trials, predictions, or pipeline.</div>
    </div>
    <div class="chat-input-row">
      <input class="chat-input" id="chat-input" placeholder="Ask about this drug..." onkeydown="if(event.key==='Enter')sendChat()">
      <button class="chat-send" onclick="sendChat()">Send</button>
    </div>
  </div>

  <script>
    const pathParts = window.location.pathname.split('/');
    const drugName = decodeURIComponent(pathParts[pathParts.length - 1]);
    const fromTicker = new URLSearchParams(location.search).get('from') || '';
    let drugData = null;
    let intelData = null;

    function $(id) { return document.getElementById(id); }

    // Update breadcrumb
    $('bc-drug').textContent = drugName;
    if (fromTicker) {
      $('bc-ticker').innerHTML = `<a href="/company/${fromTicker}">${fromTicker}</a>`;
    } else {
      $('bc-ticker').textContent = '...';
    }

    // Load sidebar from parent company
    async function loadSidebar() {
      if (!fromTicker) { $('sidebar').style.display = 'none'; return; }
      try {
        const r = await fetch(`/api/company/${fromTicker}`);
        if (!r.ok) throw new Error();
        const d = await r.json();

        $('sb-ticker').textContent = fromTicker + (d.info?.company_name ? ' · ' + d.info.company_name : '');
        $('company-bar').style.display = 'flex';
        $('cb-link').href = `/company/${fromTicker}`;
        $('cb-link').textContent = fromTicker;
        $('cb-name').textContent = d.info?.company_name || '';
        $('cb-stats').textContent = `${(d.trials||[]).length} trials · ${(d.drugs||[]).length} drugs`;

        // Drugs list — highlight current drug
        const drugs = d.drugs || [];
        $('sb-drugs').innerHTML = drugs.length === 0
          ? '<div style="padding:6px 16px;color:#64748b;font-size:11px">No drugs</div>'
          : drugs.slice(0, 15).map(dr => {
            const isActive = dr.name === drugName;
            return `<a class="sb-item${isActive?' active':''}" href="/drug/${encodeURIComponent(dr.name)}?from=${fromTicker}">${dr.name}</a>`;
          }).join('');

        // Trials list
        const trials = d.trials || [];
        $('sb-trials').innerHTML = trials.length === 0
          ? '<div style="padding:6px 16px;color:#64748b;font-size:11px">No trials</div>'
          : trials.slice(0, 25).map(t =>
            `<a class="sb-item" href="/trial/${t.nct_id}?from=${fromTicker}">${t.nct_id}</a>`
          ).join('');

        // Stock price for sidebar + company bar
        try {
          const sr = await fetch(`/api/stock/${fromTicker}`);
          if (sr.ok) {
            const s = await sr.json();
            const up = (s.change_percent||0) >= 0;
            const priceHtml = `<span style="color:#e2e8f0;font-weight:600">$${s.price?.toFixed(2)||'--'}</span> <span style="color:${up?'#10b981':'#ef4444'}">${up?'+':''}${s.change_percent?.toFixed(2)||'0'}%</span>`;
            $('sb-price').innerHTML = priceHtml;
            $('cb-price').innerHTML = priceHtml;
          }
        } catch {}
      } catch {
        $('sidebar').style.display = 'none';
      }
    }
    loadSidebar();

    function getPhaseClass(phase) {
      if (!phase) return 'phase-1';
      const p = phase.toLowerCase().replace(/\s/g,'').replace('phase','');
      if (p.includes('4')) return 'phase-4';
      if (p.includes('3')) return 'phase-3';
      if (p.includes('2')) return 'phase-2';
      return 'phase-1';
    }

    function renderDrugPage() {
      if (!drugData) { $('main-content').innerHTML = '<div class="loading">Loading...</div>'; return; }
      if (drugData.error) { $('main-content').innerHTML = `<div class="error">Error: ${drugData.error}</div>`; return; }

      // Build pipeline timeline from trial phases
      const phaseMap = {
        preclinical: {n:0, status:'none', date:null},
        phase1: {n:0, status:'none', date:null},
        phase2: {n:0, status:'none', date:null},
        phase3: {n:0, status:'none', date:null},
        phase4: {n:0, status:'none', date:null},
        approval: {n:0, status:'none', date:null}
      };

      function assignPhase(key, ph, st, compDate) {
        const isDone = st.includes('COMPLETED');
        const isActive = st.includes('RECRUIT') || st.includes('ACTIVE') || st.includes('ENROLLING');
        phaseMap[key].n++;
        if (isDone) { phaseMap[key].status = 'done'; }
        else if (isActive && phaseMap[key].status !== 'done') { phaseMap[key].status = 'active'; }
        if (compDate && (!phaseMap[key].date || compDate > phaseMap[key].date)) { phaseMap[key].date = compDate; }
      }

      (drugData.trials || []).forEach(t => {
        const ph = (t.phase || '').toUpperCase();
        const st = (t.status || '').toUpperCase();
        const bestDate = t.last_updated || null;
        if (ph.includes('4')) assignPhase('phase4', ph, st, bestDate);
        else if (ph.includes('3')) assignPhase('phase3', ph, st, bestDate);
        else if (ph.includes('2')) assignPhase('phase2', ph, st, bestDate);
        else if (ph.includes('1')) assignPhase('phase1', ph, st, bestDate);
      });

      // If Phase 4 done/active, mark approval
      if (phaseMap.phase4.status === 'done' || phaseMap.phase4.status === 'active') phaseMap.approval.status = 'done';

      // Detect skipped phases: phase has 0 trials but a LATER phase has trials
      const phaseOrder = ['phase1','phase2','phase3','phase4'];
      let hasLater = false;
      for (let i = phaseOrder.length - 1; i >= 0; i--) {
        const k = phaseOrder[i];
        if (phaseMap[k].n > 0) { hasLater = true; }
        else if (hasLater && phaseMap[k].n === 0) { phaseMap[k].status = 'skipped'; }
      }

      // Mark earlier phases as inferred-done if a later phase has actual trials
      // BUT only if they weren't already marked as skipped
      let highestWithTrials = -1;
      phaseOrder.forEach((k, i) => { if (phaseMap[k].n > 0 && (phaseMap[k].status === 'done' || phaseMap[k].status === 'active')) highestWithTrials = i; });
      phaseOrder.forEach((k, i) => { if (i < highestWithTrials && phaseMap[k].status === 'none') phaseMap[k].status = 'done'; });

      const stageLabels = [
        { key: 'phase1', label: 'Phase 1' },
        { key: 'phase2', label: 'Phase 2' },
        { key: 'phase3', label: 'Phase 3' },
        { key: 'phase4', label: 'Phase 4' },
        { key: 'approval', label: 'Approval' },
      ];
      const statusText = (s) => s === 'done' ? 'Completed' : s === 'active' ? 'Active' : s === 'skipped' ? 'Skipped' : 'Not started';
      const fmtDate = (d) => { if (!d) return ''; try { const dt = new Date(d); return dt.toLocaleDateString('en-US',{month:'short',year:'numeric'}); } catch(e) { return String(d).slice(0,7); } };

      const pipelineHtml = `
        <div class="section">
          <div class="section-header">
            <span class="section-title">🔬 Development Pipeline</span>
            <span class="source-badge source-badge-data">✓ Trial Data</span>
          </div>
          <div class="section-body">
            <div class="pipeline-tl">
              ${stageLabels.map(s => {
                const d = phaseMap[s.key];
                return `<div class="pl-stage">
                  <div class="pl-label">${s.label}</div>
                  <div class="pl-dot ${d.status}"></div>
                  <div class="pl-status ${d.status}">${statusText(d.status)}</div>
                  ${d.date ? '<div class="pl-date ' + d.status + '">Updated ' + fmtDate(d.date) + '</div>' : ''}
                  ${d.n > 0 ? '<div class="pl-count">' + d.n + ' trial' + (d.n > 1 ? 's' : '') + '</div>' : ''}
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>`;

      const conditionsHtml = (drugData.conditions || []).map(c => `<span class="condition-tag">${c}</span>`).join('') || '<span style="color:#64748b">No conditions specified</span>';
      const sponsorsHtml = (drugData.sponsors || []).map(s => `<span class="sponsor-link" onclick="window.location.href='/company/${s}'">${s}</span>`).join(', ') || 'Unknown';

      const trialsHtml = (drugData.trials || []).map(t => {
        const compDate = t.primary_completion_date ? new Date(t.primary_completion_date).toLocaleDateString('en-US',{month:'short',year:'numeric'}) : 'TBD';
        return `
          <a href="/trial/${t.nct_id}${fromTicker?'?from='+fromTicker:''}" class="trial-item" style="text-decoration:none;cursor:pointer;transition:border-color .15s" onmouseover="this.style.borderColor='#3b82f6'" onmouseout="this.style.borderColor='#1e2a3a'">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
              <div class="trial-title">${t.title || 'Untitled'}</div>
              <span class="phase-badge ${getPhaseClass(t.phase)}">${t.phase || 'Phase 1'}</span>
            </div>
            <div class="trial-meta">
              <span class="trial-tag">📋 ${t.nct_id}</span>
              <span class="trial-tag" style="color:${t.status==='RECRUITING'?'#10b981':t.status==='COMPLETED'?'#60a5fa':'#f59e0b'}">${t.status || 'Unknown'}</span>
              <span class="trial-tag">🏥 ${t.sponsor || 'Unknown'}</span>
              <span class="trial-tag">📅 ${compDate}</span>
            </div>
            <div style="font-size:13px;color:#94a3b8;margin-top:4px">
              <strong>Condition:</strong> ${t.condition || 'N/A'} · <strong>Intervention:</strong> ${t.intervention || 'N/A'}
            </div>
            <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
              ${t.results_posted ? '<span style="color:#10b981;font-size:12px">✓ Results Posted</span>' : '<span style="color:#3b82f6;font-size:12px;font-weight:600">🎯 View Prediction & Analysis →</span>'}
            </div>
          </a>`;
      }).join('') || '<div style="color:#64748b">No clinical trials found</div>';

      $('main-content').innerHTML = `
        <div class="drug-header">
          <div class="drug-name">💊 ${drugData.drug_name}</div>
          <span class="phase-badge ${getPhaseClass(drugData.phase)}">${drugData.phase || 'Phase 1'}</span>
          <div class="drug-meta">
            <div class="meta-item"><span class="meta-label">Sponsors</span><span class="meta-value">${sponsorsHtml}</span></div>
            <div class="meta-item"><span class="meta-label">Active Trials</span><span class="meta-value">${drugData.trial_count || 0}</span></div>
          </div>
        </div>

        ${pipelineHtml}

        <!-- Verified Data: Therapeutic Areas -->
        <div class="section">
          <div class="section-header">
            <span class="section-title">🏥 Therapeutic Areas</span>
            <span class="source-badge source-badge-data">✓ Database</span>
          </div>
          <div class="section-body">${conditionsHtml}</div>
        </div>

        <!-- Verified Data: Clinical Trials -->

    async function sendChat() {
      const input = $('chat-input');
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      const msgs = $('chat-messages');
      msgs.innerHTML += `<div class="chat-msg chat-msg-user">You: ${msg}</div>`;
      msgs.innerHTML += `<div class="chat-msg chat-msg-ai" id="chat-loading"><span class="ai-loading-pulse"></span> Thinking...</div>`;
      msgs.scrollTop = msgs.scrollHeight;
      try {
        const ctx = intelData ? { focal_trial: intelData.focal_trial, prediction: intelData.prediction, domain: intelData.domain, drug: drugName } : { drug: drugName };
        const r = await fetch(`/api/chat/DRUG_${encodeURIComponent(drugName)}`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({message: msg, context: ctx}),
          signal: AbortSignal.timeout(45000),
        });
        const d = await r.json();
        const el = document.getElementById('chat-loading'); if(el) el.remove();
        const sources = d.sources?.length ? `<div class="chat-msg-meta">Sources: ${d.sources.join(', ')}</div>` : '';
        msgs.innerHTML += `<div class="chat-msg chat-msg-ai">AI: ${(d.response||'No response.').replace(/\n/g,'<br>')}${sources}</div>`;
      } catch(e) {
        const el = document.getElementById('chat-loading'); if(el) el.remove();
        msgs.innerHTML += `<div class="chat-msg chat-msg-ai" style="color:#f87171">Error: ${e.message}</div>`;
      }
      msgs.scrollTop = msgs.scrollHeight;
    }

    // MiroFish simulation removed
    async function runSimulation_REMOVED() {
      const btn = $('sim-run-btn');
      const results = $('sim-results');
      if (!btn || !results) return;
      btn.disabled = true;
      btn.textContent = 'Running...';
      results.innerHTML = '<div style="color:#64748b;font-size:13px"><span class="ai-loading-pulse"></span> Simulating 1,000 patient agents...</div>';

      // Get condition from loaded drug data
      const condition = (drugData && drugData.conditions && drugData.conditions[0]) || 'unknown';
      // Infer disease group from condition keywords
      const condLower = condition.toLowerCase();
      const diseaseGroup = condLower.includes('cancer') || condLower.includes('tumor') || condLower.includes('carcinoma') || condLower.includes('melanoma') || condLower.includes('leukemia') ? 'oncology_solid'
        : condLower.includes('heart') || condLower.includes('cardiac') || condLower.includes('hypertension') || condLower.includes('coronary') ? 'cardiovascular'
        : condLower.includes('diabetes') || condLower.includes('metabolic') || condLower.includes('obesity') ? 'metabolic'
        : condLower.includes('arthritis') || condLower.includes('lupus') || condLower.includes('autoimmune') || condLower.includes('crohn') || condLower.includes('psoriasis') || condLower.includes('spondyl') ? 'autoimmune'
        : condLower.includes('alzheimer') || condLower.includes('parkinson') || condLower.includes('epilepsy') || condLower.includes('neuro') || condLower.includes('sclerosis') ? 'neurology'
        : condLower.includes('infection') || condLower.includes('hiv') || condLower.includes('hepatitis') || condLower.includes('influenza') || condLower.includes('covid') ? 'infectious_disease'
        : condLower.includes('asthma') || condLower.includes('copd') || condLower.includes('pulmonary') || condLower.includes('respiratory') ? 'respiratory'
        : condLower.includes('kidney') || condLower.includes('renal') || condLower.includes('dialysis') ? 'renal'
        : (drugData && drugData.disease_group) || 'other';

      try {
        const r = await fetch('/api/simulation/run', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({drug_name: drugName, condition: condition, disease_group: diseaseGroup, population_size: 1000}),
          signal: AbortSignal.timeout(120000),
        });
        const d = await r.json();
        const pop = d.population || {};
        const dem = d.demand || {};

        // Age segments chart
        const ageSegs = dem.age_segments || {};
        const maxAge = Math.max(...Object.values(ageSegs), 1);
        const ageHtml = Object.entries(ageSegs).map(([k,v]) => `
          <div style="display:flex;align-items:center;gap:8px;margin:3px 0">
            <span style="color:#94a3b8;font-size:11px;min-width:40px">${k}</span>
            <div style="flex:1;height:12px;background:#1e293b;border-radius:3px;overflow:hidden">
              <div style="height:100%;width:${v/maxAge*100}%;background:#14b8a6;border-radius:3px"></div>
            </div>
            <span style="color:#5eead4;font-size:11px;min-width:30px;text-align:right">${v}</span>
          </div>
        `).join('');

        // Comorbidities
        const comorbs = pop.top_comorbidities || [];
        const comorbHtml = comorbs.map(([name, count]) =>
          `<span style="display:inline-block;background:#1e293b;color:#94a3b8;border-radius:4px;padding:2px 8px;margin:2px;font-size:11px">${name.replace(/_/g,' ')} (${count})</span>`
        ).join('');

        const epi = dem.epidemiology || {};
        const mkt = dem.market || {};
        const rev = dem.revenue_projections || {};
        const adopt = dem.adoption_curve || [];
        const priceSens = dem.price_sensitivity || [];

        // Adoption curve chart (simple SVG)
        const adoptSvg = adopt.length > 0 ? (() => {
          const w = 300, h = 100, pad = 5;
          const maxPct = Math.max(...adopt.map(a => a.adoption_pct), 1);
          const points = adopt.map((a, i) => `${pad + (i/(adopt.length-1))*(w-2*pad)},${h-pad-(a.adoption_pct/maxPct)*(h-2*pad)}`).join(' ');
          return `<svg width="${w}" height="${h}" style="display:block;margin-top:8px">
            <polyline points="${points}" fill="none" stroke="#14b8a6" stroke-width="2"/>
            <polyline points="${pad},${h-pad} ${points} ${w-pad},${h-pad}" fill="url(#adoptGrad)" stroke="none"/>
            <defs><linearGradient id="adoptGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#14b8a640"/><stop offset="100%" stop-color="#14b8a600"/></linearGradient></defs>
            <text x="${pad}" y="${h-2}" fill="#64748b" font-size="9">Q1Y1</text>
            <text x="${w-30}" y="${h-2}" fill="#64748b" font-size="9">Q4Y5</text>
          </svg>`;
        })() : '';

        // Revenue bar chart
        const revBars = rev.year1 ? `
          <div style="display:flex;gap:8px;align-items:flex-end;height:80px;margin-top:8px">
            ${[{y:'Y1',v:rev.year1},{y:'Y3',v:rev.year3},{y:'Y5',v:rev.year5}].map(r => {
              const maxRev = Math.max(rev.year5?.revenue_m||1, 1);
              const h = Math.max((r.v?.revenue_m||0)/maxRev*60, 4);
              return `<div style="flex:1;text-align:center">
                <div style="font-size:10px;color:#5eead4;font-weight:700">$${r.v?.revenue_m||0}M</div>
                <div style="height:${h}px;background:linear-gradient(180deg,#14b8a6,#0d9488);border-radius:3px 3px 0 0;margin:2px auto;width:80%"></div>
                <div style="font-size:9px;color:#64748b">${r.y}</div>
                <div style="font-size:8px;color:#475569">${(r.v?.patients||0).toLocaleString()} pts</div>
              </div>`;
            }).join('')}
          </div>` : '';

        results.innerHTML = `
          <!-- Row 1: Demand + Market + Revenue -->
          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
            <div class="pred-card" style="flex:1;min-width:140px">
              <div class="pred-label">Demand Score</div>
              <div style="font-size:32px;font-weight:700;color:${dem.demand_score>50?'#10b981':'#f59e0b'}">${dem.demand_score || '?'}<span style="font-size:14px;color:#64748b">/100</span></div>
              <div style="font-size:11px;color:#64748b;margin-top:4px">Unmet need: <strong style="color:#a78bfa">${epi.unmet_need_score || '?'}/10</strong></div>
              <div style="font-size:11px;color:#64748b">Competition: ${dem.alternative_therapies || '?'} therapies</div>
            </div>
            <div class="pred-card" style="flex:1;min-width:140px">
              <div class="pred-label">Global Market</div>
              <div style="font-size:28px;font-weight:700;color:#60a5fa">$${mkt.total_market_bn || '?'}B</div>
              <div style="font-size:11px;color:#64748b">Growth: <strong style="color:#4ade80">+${mkt.growth_rate_pct || '?'}%</strong>/year</div>
              <div style="font-size:11px;color:#64748b">Avg cost: $${(mkt.avg_treatment_cost_usd||0).toLocaleString()}/patient</div>
            </div>
            <div class="pred-card" style="flex:1;min-width:160px">
              <div class="pred-label">Revenue Projection</div>
              ${revBars}
            </div>
          </div>

          <!-- Row 2: Epidemiology + Population + Adoption -->
          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
            <div class="pred-card" style="flex:1;min-width:140px">
              <div class="pred-label">Epidemiology</div>
              <div style="font-size:13px;color:#e2e8f0;margin-top:4px">
                Prevalence: <strong>${epi.prevalence_per_100k || '?'}</strong>/100K<br>
                Global patients: <strong>${(epi.total_patients_global||0).toLocaleString()}</strong><br>
                Addressable: <strong>${(epi.addressable_market||0).toLocaleString()}</strong><br>
                Mortality: <strong>${((epi.mortality_rate||0)*100).toFixed(1)}%</strong>
              </div>
            </div>
            <div class="pred-card" style="flex:1;min-width:140px">
              <div class="pred-label">Patient Population (n=${pop.population_size || '?'})</div>
              <div style="font-size:12px;color:#e2e8f0;margin-top:4px">
                Avg age: <strong>${pop.avg_age || '?'}</strong> | ${pop.female_pct || '?'}% female<br>
                Seeking treatment: <strong>${pop.treatment_seeking_pct || '?'}%</strong><br>
                Insured: <strong>${pop.insured_pct || '?'}%</strong><br>
                Adherent: <strong>${pop.adherent_pct || '?'}%</strong>
              </div>
            </div>
            <div class="pred-card" style="flex:1;min-width:160px">
              <div class="pred-label">Adoption Curve (5-year)</div>
              ${adoptSvg}
              <div style="font-size:10px;color:#64748b;margin-top:4px">S-curve market penetration model</div>
            </div>
          </div>

          <!-- Row 3: Age + Comorbidities + Price Sensitivity -->
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <div class="pred-card" style="flex:1;min-width:140px">
              <div class="pred-label">Age Distribution</div>
              <div style="margin-top:6px">${ageHtml}</div>
            </div>
            <div class="pred-card" style="flex:1;min-width:140px">
              <div class="pred-label">Comorbidities</div>
              <div style="margin-top:4px">${comorbHtml || '<span style="color:#64748b;font-size:11px">None</span>'}</div>
              <div style="font-size:11px;color:#64748b;margin-top:8px">Drug interaction risk: <strong style="color:#f87171">${dem.comorbidity_conflict_rate || '?'}%</strong></div>
            </div>
            <div class="pred-card" style="flex:1;min-width:160px">
              <div class="pred-label">Price Sensitivity</div>
              <div style="margin-top:6px">
                ${priceSens.slice(0,4).map(ps => `
                  <div style="display:flex;justify-content:space-between;font-size:11px;margin:2px 0">
                    <span style="color:#94a3b8">$${ps.price_usd.toLocaleString()}</span>
                    <span style="color:#5eead4">${ps.patients.toLocaleString()} pts → $${ps.revenue_m}M</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
          <div style="font-size:10px;color:#475569;margin-top:8px">Source: ${d.simulation_type || 'local'} | ${d.elapsed_seconds || '?'}s | Population: ${pop.population_size || '?'} simulated agents</div>
        `;
      } catch(e) {
        results.innerHTML = `<span style="color:#f87171;font-size:13px">Simulation failed: ${e.message}</span>`;
      }
      btn.disabled = false;
      btn.textContent = 'Run Demand Simulation';
    }

    document.addEventListener('DOMContentLoaded', loadDrugData);
  </script>
</body>
</html>
